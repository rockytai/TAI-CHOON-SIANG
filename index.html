<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clash of Words</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Titan+One&family=Nunito:wght@400;700;900&display=swap');
      
      body {
        font-family: 'Nunito', sans-serif;
        background-color: #1a1a1a;
        overflow: hidden; /* Prevent scrolling on main body, handle in app */
      }
      
      .font-titan {
        font-family: 'Titan One', cursive;
      }

      /* Custom Scrollbar for the map */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #2d2d2d; 
      }
      ::-webkit-scrollbar-thumb {
        background: #fbbf24; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #f59e0b; 
      }
      
      .coc-panel {
        background: linear-gradient(to bottom, #f3f4f6, #d1d5db);
        border: 4px solid #4b5563;
        box-shadow: 0 4px 6px rgba(0,0,0,0.5);
      }
    </style>
